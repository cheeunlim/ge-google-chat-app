<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#188038"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5F6368"/>
    </marker>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #202124; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #5F6368; }
      .box-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #202124; }
      .box-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #5F6368; }
      .step-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #202124; }
      .step-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #5F6368; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .note-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #174EA6; }
      .note-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #3C4043; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="470" rx="14" stroke="#E8EAED" stroke-width="1.5"/>

  <text x="32" y="38" class="title">Gemini Enterprise - Google Chat Architecture</text>
  <text x="32" y="58" class="subtitle">Async Cloud Run bridge avoids the 30-second Chat webhook limit while preserving per-user Drive ACLs.</text>

  <rect x="32" y="92" width="210" height="118" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="137" y="126" text-anchor="middle" class="box-title">Google Chat</text>
  <text x="137" y="148" text-anchor="middle" class="box-sub">User Messages</text>
  <rect x="50" y="162" width="174" height="34" rx="6" fill="#FFFFFF" stroke="#AECBFA" stroke-width="1"/>
  <text x="137" y="177" text-anchor="middle" class="step-sub">@Bot query (Public)</text>
  <text x="137" y="191" text-anchor="middle" class="step-sub">/private query (Only You)</text>

  <rect x="355" y="92" width="215" height="118" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="1.5"/>
  <text x="462" y="126" text-anchor="middle" class="box-title">Cloud Run (FastAPI)</text>
  <text x="462" y="148" text-anchor="middle" class="box-sub">Async Webhook Bridge</text>
  <rect x="373" y="162" width="179" height="34" rx="6" fill="#FFFFFF" stroke="#A8DAB5" stroke-width="1"/>
  <text x="462" y="177" text-anchor="middle" class="step-sub">Per-User OAuth (/login)</text>
  <text x="462" y="191" text-anchor="middle" class="step-sub">Background Task Runner</text>

  <rect x="680" y="92" width="208" height="118" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
  <text x="784" y="126" text-anchor="middle" class="box-title">Gemini Enterprise</text>
  <text x="784" y="148" text-anchor="middle" class="box-sub">streamAssist API</text>
  <rect x="698" y="162" width="172" height="34" rx="6" fill="#FFFFFF" stroke="#FDD663" stroke-width="1"/>
  <text x="784" y="177" text-anchor="middle" class="step-sub">Drive, Gmail &amp; Data Stores</text>
  <text x="784" y="191" text-anchor="middle" class="step-sub">Multi-turn GE Sessions</text>

  <line x1="242" y1="126" x2="348" y2="126" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="295" cy="108" r="10" fill="#1A73E8"/>
  <text x="295" y="112" text-anchor="middle" class="badge-text">1</text>
  <text x="295" y="143" text-anchor="middle" class="step-sub">POST Event</text>

  <line x1="355" y1="176" x2="249" y2="176" stroke="#5F6368" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-gray)"/>
  <circle cx="295" cy="161" r="10" fill="#5F6368"/>
  <text x="295" y="165" text-anchor="middle" class="badge-text">2</text>
  <text x="295" y="194" text-anchor="middle" class="step-sub">Fast 200 OK {}</text>

  <line x1="570" y1="126" x2="673" y2="126" stroke="#188038" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="622" cy="108" r="10" fill="#188038"/>
  <text x="622" y="112" text-anchor="middle" class="badge-text">3</text>
  <text x="622" y="143" text-anchor="middle" class="step-sub">User OAuth Token</text>

  <line x1="680" y1="176" x2="577" y2="176" stroke="#188038" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="622" cy="161" r="10" fill="#188038"/>
  <text x="622" y="165" text-anchor="middle" class="badge-text">4</text>
  <text x="622" y="194" text-anchor="middle" class="step-sub">Answer + Session ID</text>

  <path d="M 462 210 L 462 276 L 137 276 L 137 217" fill="none" stroke="#1A73E8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="200" y="254" width="204" height="42" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.2"/>
  <circle cx="220" cy="275" r="10" fill="#1A73E8"/>
  <text x="220" y="279" text-anchor="middle" class="badge-text">5</text>
  <text x="238" y="271" class="step-text">Async Reply via Chat API</text>
  <text x="238" y="286" class="step-sub">Public PATCH / Private POST</text>

  <rect x="32" y="326" width="272" height="114" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="48" y="352" class="note-title">1. Why Cloud Run?</text>
  <text x="48" y="374" class="note-body">Apps Script hits a hard 30s timeout on Chat.</text>
  <text x="48" y="393" class="note-body">Cloud Run returns 200 OK immediately and</text>
  <text x="48" y="412" class="note-body">finishes streamAssist in the background.</text>

  <rect x="324" y="326" width="272" height="114" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="340" y="352" class="note-title">2. Why User OAuth?</text>
  <text x="340" y="374" class="note-body">Service accounts cannot see personal Drive files.</text>
  <text x="340" y="393" class="note-body">A one-time login lets Gemini Enterprise enforce</text>
  <text x="340" y="412" class="note-body">each user's own Workspace permissions.</text>

  <rect x="616" y="326" width="272" height="114" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="632" y="352" class="note-title">3. Public vs. Private</text>
  <text x="632" y="374" class="note-body">@Mention replies are visible to the whole Space.</text>
  <text x="632" y="393" class="note-body">/private uses privateMessageViewer so only the</text>
  <text x="632" y="412" class="note-body">asking user sees the answer.</text>
</svg>
